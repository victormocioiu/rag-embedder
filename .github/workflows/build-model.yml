name: build-model
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.model
      - scripts/export_model.py
      - pyproject.toml
      - .github/workflows/build-model.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.model
          push: true
          # avx512_vnni: the embed node is AMD EPYC Genoa (Zen 4), which has
          # AVX-512 WITH VNNI -- no saturation problem, reduce_range not needed
          build-args: QUANT_TARGET=avx512_vnni
          # v1: per-channel quantization, VNNI preset
          tags: ghcr.io/${{ github.repository_owner }}/rag-embedder-model:e5-small-avx512vnni-v1
          cache-from: type=gha,scope=model
          cache-to: type=gha,mode=max,scope=model

# Bump the tag suffix (-v1 -> -v2) when re-exporting the same model+target with
# changed tooling, so running apps keep a stable artifact until rebuilt.
# AFTER the first push, make the GHCR package rag-embedder-model PUBLIC —
# the in-cluster builder pulls it anonymously.
